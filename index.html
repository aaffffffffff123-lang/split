<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>나에게서 도망치기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{
    --paper:#ECEEF1;
    --floor:#E3E6EA;
    --line:#CFD4DA;
    --ghost:#98A0A9;
    --ink:#1B2430;
    /* 타원 바깥 — 어둠 */
    --night:#05070B;
    --night2:#151C27;
    --lit:#E6ECF4;
    --lit2:#8E9BAC;
    --litLine:#394454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--night);color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none;}
  #room{position:fixed;inset:0;display:none;}
  #room canvas{display:block;width:100%;height:100%;}

  #btnMute{
    position:fixed;z-index:40;
    top:calc(8px + env(safe-area-inset-top));
    right:calc(8px + env(safe-area-inset-right));
    width:40px;height:40px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:none;border:0;color:var(--ghost);
    cursor:pointer;opacity:.75;
  }
  #btnMute:active{opacity:1;}
  #btnMute:focus-visible{outline:2px solid var(--ghost);outline-offset:2px;}
  #btnMute .sl{display:none;}
  #btnMute.off .wv{display:none;}
  #btnMute.off .sl{display:block;}

  /* ── 인트로 ── */
  #intro{
    position:fixed;inset:0;z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(34px + env(safe-area-inset-top)) 22px calc(9vh + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  #intro.on{display:flex;}
  #title{
    font-family:'Galmuri11','Galmuri14',monospace;
    font-size:36px;line-height:1.25;letter-spacing:0;
    color:var(--lit);text-align:center;
    padding:0 44px;
  }
  @media (min-width:560px) and (min-height:560px){
    #title{font-size:48px;}
  }
  #introActs{
    width:100%;max-width:360px;
    display:flex;flex-direction:column;gap:10px;
    pointer-events:auto;
  }

  #ui{
    position:fixed;inset:0;z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 22px calc(9vh + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  #ui.on{display:flex;}

  #count{
    font-size:clamp(56px,17vw,120px);
    font-weight:200;letter-spacing:-0.05em;line-height:1;
    opacity:0;transition:opacity .7s ease;
  }
  #count.on{opacity:1;}

  #acts{
    margin-top:26px;width:100%;max-width:360px;
    display:flex;flex-direction:column;gap:10px;
    opacity:0;transform:translateY(10px);
    transition:opacity .5s ease,transform .5s ease;
  }
  #acts.on{opacity:1;transform:none;pointer-events:auto;}

  .btn{
    width:100%;padding:15px 16px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-size:16px;font-weight:600;letter-spacing:-0.03em;
    color:var(--ink);background:#fff;
    border:2px solid var(--ink);border-radius:0;
    cursor:pointer;transition:transform .06s ease,box-shadow .06s ease;
    box-shadow:4px 4px 0 var(--ink);
  }
  .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .btn:focus-visible{outline:3px solid var(--ghost);outline-offset:3px;}
  .btn.quiet{background:transparent;border-color:var(--ghost);color:#5c646d;box-shadow:none;}
  .btn.quiet:active{transform:none;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn svg{flex:none;}

  /* ── 랭킹 ── */
  #panel{
    position:fixed;inset:0;z-index:30;display:none;
    flex-direction:column;align-items:center;justify-content:flex-start;
    gap:12px;
    padding:calc(58px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
    background:rgba(5,7,11,.975);
  }
  #panel.on{display:flex;}
  /* 어두운 화면 위에 놓이는 버튼 — 끝난 뒤 밝은 방에 뜨는 #ui와 색이 반대 */
  #intro .btn,#panel .btn{
    background:var(--lit);color:#141A22;
    border-color:var(--lit);box-shadow:4px 4px 0 var(--night2);
  }
  #intro .btn:active,#panel .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--night2);}
  #intro .btn:focus-visible,#panel .btn:focus-visible{outline:3px solid var(--lit2);}
  #intro .btn.quiet,#panel .btn.quiet{
    background:transparent;color:var(--lit2);
    border-color:var(--litLine);box-shadow:none;
  }
  #intro .btn.quiet:active,#panel .btn.quiet:active{transform:none;}

  #panel .box{width:100%;max-width:360px;}
  #nameRow{display:flex;gap:8px;}
  #nameIn{
    flex:1;min-width:0;padding:14px 12px;
    font:inherit;font-size:16px;font-weight:600;letter-spacing:-0.03em;
    border:2px solid var(--litLine);background:#151B25;color:var(--lit);border-radius:0;
  }
  #nameIn::placeholder{color:#5C6878;}
  #nameIn:focus{outline:3px solid var(--lit2);outline-offset:2px;}
  #nameRow .btn{width:auto;flex:none;padding:14px 18px;}

  #btnClose{
    position:absolute;
    top:calc(10px + env(safe-area-inset-top));
    right:calc(10px + env(safe-area-inset-right));
    width:40px;height:40px;padding:0;display:none;
    align-items:center;justify-content:center;
    background:none;border:0;color:var(--lit2);cursor:pointer;
  }
  #btnClose:focus-visible{outline:2px solid var(--lit2);outline-offset:2px;}

  #panel.viewonly #nameRow{display:none;}
  #panel.viewonly #backBox{display:none;}
  #panel.viewonly #btnClose{display:flex;}

  #board{
    width:100%;max-width:360px;flex:1;min-height:0;overflow:auto;
    border:2px solid var(--litLine);background:#12171F;
    -webkit-overflow-scrolling:touch;
  }
  .row{
    display:flex;align-items:baseline;gap:10px;
    padding:10px 13px;border-bottom:1px solid #232C38;
    font-size:15px;letter-spacing:-0.02em;color:var(--lit);
  }
  .row:last-child{border-bottom:0;}
  .row.me{background:#1E2B3C;}
  .row .no{width:26px;color:#6E7B8C;font-variant-numeric:tabular-nums;font-size:13px;}
  .row .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .va{font-variant-numeric:tabular-nums;font-weight:700;}
  .note{font-size:13px;color:var(--lit2);text-align:center;letter-spacing:-0.02em;min-height:18px;}
  @media (prefers-reduced-motion:reduce){
    #count,#acts,.btn{transition:none;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="room"></div>

<button id="btnMute" type="button" aria-label="소리">
  <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
    <path d="M3.6 9.3h3.5L11.8 5.3v13.4L7.1 14.7H3.6z" fill="currentColor"/>
    <g class="wv" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M15.1 9.3a4.1 4.1 0 0 1 0 5.4"/>
      <path d="M17.8 6.8a7.7 7.7 0 0 1 0 10.4"/>
    </g>
    <path class="sl" d="M15.4 9.6l5 4.8M20.4 9.6l-5 4.8"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>

<div id="intro">
  <div id="title">나에게서 도망치기</div>
  <div id="introActs">
    <button class="btn" id="btnStart">도망치기</button>
    <button class="btn quiet" id="btnRankIntro">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.2 4h9.6v4.7a4.8 4.8 0 0 1-9.6 0z"/>
        <path d="M7.2 5.6H4.7v1.5a2.9 2.9 0 0 0 2.8 2.9"/>
        <path d="M16.8 5.6h2.5v1.5a2.9 2.9 0 0 1-2.8 2.9"/>
        <path d="M12 13.5v3.2"/>
        <path d="M9.4 20.2l.6-3.5h4l.6 3.5z"/>
      </svg>
      <span>랭킹</span>
    </button>
  </div>
</div>

<div id="ui">
  <div id="count">0</div>
  <div id="acts">
    <button class="btn" id="btnRank">랭킹 등록하기</button>
    <button class="btn quiet" id="btnAgain">다시 도망치기</button>
  </div>
</div>

<div id="panel">
  <button id="btnClose" type="button" aria-label="닫기">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
  <div class="box" id="nameRow">
    <input id="nameIn" maxlength="8" autocomplete="off" spellcheck="false" aria-label="이름">
    <button class="btn" id="btnSend">등록</button>
  </div>
  <div id="board"></div>
  <div class="note" id="note"></div>
  <div class="box" id="backBox"><button class="btn quiet" id="btnBack">다시 도망치기</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* ══════════════════════════════════════════════════
   앱스스크립트 웹앱 주소(/exec)를 넣으면 랭킹이 살아납니다.
   비워두면 랭킹 버튼이 안 나오고 다시 시작만 됩니다.
   ══════════════════════════════════════════════════ */
var RANK_URL = 'https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec';

/* ══════════════════════════════════════════════════
   조절용 숫자
   ══════════════════════════════════════════════════ */
var CFG = {
  /* 무대 — 타원입니다. 고정 크기라 화면이 크면 판이 넓어지는 게
     아니라 전체가 확대됩니다. 그래야 폰과 PC가 같은 게임이 됩니다.
     가로:세로 비율은 위에서 본 뇌 비율에 맞춰져 있습니다. */
  arenaW: 380,
  arenaH: 460,

  /* 분열 — 나만 갈라짐. 주기가 계속 짧아짐. 상한 없음 */
  splitFirst: 2.0,
  splitStart: 2.4,
  splitMin: 0.45,
  splitAccel: 0.026,

  /* 분신이 물려받는 내 동선 */
  pathSeconds: 2.6,
  cloneSpeed: 46,
  clonePause: 0.35,

  /* 후반 조이기 — 분열 주기가 바닥을 친 뒤에 걷는 속도로 조입니다 */
  lateFrom: 68,          // 이 초부터
  cloneSpeedGain: 0.52,  // 초당 붙는 속도
  cloneSpeedMax: 82,
  clonePauseDrop: 0.004, // 초당 줄어드는 멈춤
  clonePauseMin: 0.10,

  /* 분열 순간 물려준 동선을 잠깐 보여줍니다 */
  pathShow: 0.55,

  /* 나 */
  playerSpeed: 92,
  playerHP: 3,
  invuln: 1.3,
  findGlow: 1.1,
  hitDist: 15,

  /* 부딪혔을 때 — 갇힌 채로 연속으로 맞지 않게 밀어냅니다 */
  hitShoveR: 46,
  hitShovePow: 26,
  hitKnock: 130,
  endShoveR: 34,
  endShovePow: 16,

  /* 죽은 뒤 — 타원이 뇌가 되는 구간 */
  deathHold: 0.35,   // 잡힌 채로 멈춰 있는 시간
  figOut: 0.55,      // 인물이 사라지는 데 걸리는 시간
  shapeFrom: 0.25,   // 윤곽이 뇌 모양으로 변형 시작
  shapeTo: 1.55,     //  〃                    완료
  lineFrom: 0.60,    // 주름선과 분홍이 드러나기 시작
  lineTo: 1.60,      //  〃                        완료
  brainHold: 1.10,   // 다 그려진 뇌가 멈춰 있는 시간
  brainZoom: 0.05,   // 변형되는 동안 확대되는 비율

  /* 뇌 색 — 종이 위에 칠한 정도로만 */
  brainLight:   "#F2D8D3",  // 가운데
  brainDeep:    "#DCADA7",  // 가장자리
  brainEdge:    "#8E5B58",  // 바깥 윤곽선
  brainLine:    "#B4736F",  // 주름
  brainFissure: "#8E5150",  // 정중앙 틈

  /* 타원 바깥 — 아무것도 없는 어둠. 경계는 흐리지 않고 딱 끊깁니다 */

  /* 처음 들어왔을 때 조작을 알려주는 표시 — 한 번 움직이면 사라집니다 */
  hintFade: 0.45,

  /* 마무리 */
  wakeDelay: 0.75,
  eyeShut: 1.5,
  eyeOpen: 0.7,
  countDelay: 0.9,
  actsDelay: 0.7,

  /* 소리 — 0으로 두면 그 소리만 빠집니다 */
  snd: {
    master:  0.55,
    drone:   0.075,   // 깔리는 저음 최대치
    split:   0.30,    // 분열
    hit:     0.55,    // 피격
    death:   0.60,    // 죽음
    heart:   0.30,    // 뇌가 드러날 때 심장
    swell:   0.16,    // 뇌가 드러날 때 번짐
    breath:  0.20     // 눈 뜨기 직전 숨
  }
};

/* 2D 인물 색 — 오락실 얼굴과 같은 색 */
var SKIN  = "#EDBC97";
var SHIRT = "#41506A";
var PANTS = "#28303E";
var HAIR  = "#1B2430";
var OUTL  = "rgba(20,26,36,0.32)";

var ME_PAL = { skin:SKIN, shirt:SHIRT, pants:PANTS, hair:HAIR };

/* ══════════════════════════════════════════════════ 판 */
var cv = document.getElementById("stage");
var ctx = cv.getContext("2d", { alpha:false });
var roomEl = document.getElementById("room");
var introEl = document.getElementById("intro");
var uiEl = document.getElementById("ui");
var countEl = document.getElementById("count");
var actsEl = document.getElementById("acts");
var panelEl = document.getElementById("panel");
var boardEl = document.getElementById("board");
var noteEl = document.getElementById("note");
var nameIn = document.getElementById("nameIn");
var muteEl = document.getElementById("btnMute");

var W=0,H=0,DPR=1;
var COL = { paper:"#ECEEF1", floor:"#E3E6EA", line:"#CFD4DA", ghost:"#98A0A9", ink:"#1B2430",
            night:"#05070B", night2:"#151C27",
            lit:"#E6ECF4", lit2:"#8E9BAC", litLine:"#394454" };

var REDUCE = false;
try{ REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

/* 색 섞기 */
function hex3(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
var MIXC = {
  floor:  hex3(COL.floor),
  line:   hex3(COL.line),
  ink:    hex3(COL.ink),
  light:  hex3(CFG.brainLight),
  deep:   hex3(CFG.brainDeep),
  edge:   hex3(CFG.brainEdge),
  gyrus:  hex3(CFG.brainLine),
  fiss:   hex3(CFG.brainFissure)
};
function mix(a,b,k,alpha){
  var r=Math.round(a[0]+(b[0]-a[0])*k);
  var g=Math.round(a[1]+(b[1]-a[1])*k);
  var bl=Math.round(a[2]+(b[2]-a[2])*k);
  if(alpha===undefined) return "rgb("+r+","+g+","+bl+")";
  return "rgba("+r+","+g+","+bl+","+alpha+")";
}
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* 무대는 항상 이 좌표계 안에서 돌아갑니다 */
var arena = { x:0, y:0, w:CFG.arenaW, h:CFG.arenaH, cx:0, cy:0, rx:0, ry:0 };
var view = { s:1, ox:0, oy:0 };

function layout(){
  arena.x = 0; arena.y = 0;
  arena.w = CFG.arenaW; arena.h = CFG.arenaH;
  arena.cx = arena.x + arena.w/2;
  arena.cy = arena.y + arena.h/2;
  arena.rx = arena.w/2;
  arena.ry = arena.h/2;
  // 위쪽에 체력 점이 들어갈 자리를 남기고 화면에 맞춥니다
  var availW = Math.max(80, W - 24);
  var availH = Math.max(80, H - 64);
  view.s = Math.min(availW/arena.w, availH/arena.h);
  view.ox = (W - arena.w*view.s) / 2;
  view.oy = (H - arena.h*view.s) / 2 + 10;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
  buildSprites();
  if (room.ready) room.resize();
}
window.addEventListener("resize", resize);

var PHASE = { INTRO:"intro", RUN:"run", MORPH:"morph", FADE:"fade", WAKE:"wake" };

var phase, t, phaseT, player, clones, sparks, ghosts;
var trail, trailTimer, splitTimer, shake, score;
var TRAIL_DT = 0.05;

var MORPH_TOTAL = CFG.deathHold + CFG.lineTo + CFG.brainHold;

/* ══════════════════════════════════════════════════ 소리
   파일 없이 전부 만들어 씁니다. 브라우저 규칙상 사용자가
   화면을 한 번 건드려야 열립니다. */
var audio = (function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac=null, master=null, noise=null, ready=false;
  var on = true, ducked = false, wantDrone = false;
  var drone = null;

  try{ on = window.localStorage.getItem("najasin_mute") !== "1"; }catch(e){}

  function build(){
    if(ac || !AC) return;
    try{ ac = new AC(); }catch(e){ ac=null; return; }
    master = ac.createGain();
    master.gain.value = (on && !ducked) ? CFG.snd.master : 0;
    master.connect(ac.destination);

    var n = Math.floor(ac.sampleRate * 1.5);
    noise = ac.createBuffer(1, n, ac.sampleRate);
    var d = noise.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    ready = true;
  }
  /* resume은 비동기입니다. 예전 코드는 resume 직후에 드론을 걸어서
     첫 판에는 소리가 하나도 안 났습니다. 이제 열린 다음에 겁니다. */
  function unlock(){
    build();
    if(!ac) return;
    if(ac.state === "suspended"){
      var p = ac.resume();
      if(p && p.then) p.then(function(){ if(wantDrone) startDrone(); }, function(){});
    } else if(wantDrone && !drone){
      startDrone();
    }
  }
  function live(){ return ready && ac && ac.state === "running"; }

  function burst(when, dur, type, freq, q, vol, curveEnd){
    var s = ac.createBufferSource(); s.buffer = noise;
    var f = ac.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(freq, when);
    if(curveEnd) f.frequency.exponentialRampToValueAtTime(curveEnd, when+dur);
    f.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0006, when+dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(when); s.stop(when+dur+0.02);
  }
  function tone(when, dur, type, f0, f1, vol){
    var o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), when+dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0006, when);
    g.gain.exponentialRampToValueAtTime(vol, when+dur*0.08);
    g.gain.exponentialRampToValueAtTime(0.0006, when+dur);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when+dur+0.02);
  }

  /* 깔리는 저음 — 분신이 늘수록 커지고 높아집니다 */
  function startDrone(){
    wantDrone = true;
    if(!live() || drone) return;
    var t0 = ac.currentTime;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(CFG.snd.drone*0.22, t0+1.4);
    var f = ac.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(420, t0);
    f.Q.value = 0.7;
    var a = ac.createOscillator(); a.type="triangle"; a.frequency.setValueAtTime(52, t0);
    var b = ac.createOscillator(); b.type="sine";     b.frequency.setValueAtTime(52.6, t0);
    a.connect(f); b.connect(f); f.connect(g); g.connect(master);
    a.start(t0); b.start(t0);
    drone = { a:a, b:b, g:g, f:f };
  }
  function tension(n){
    if(!drone || !live()) return;
    var k = Math.min(1, n/34);
    var t0 = ac.currentTime;
    drone.g.gain.setTargetAtTime(CFG.snd.drone*(0.22+0.78*k), t0, 0.5);
    drone.a.frequency.setTargetAtTime(52 + k*13, t0, 0.9);
    drone.b.frequency.setTargetAtTime(52.6 + k*13.4, t0, 0.9);
    drone.f.frequency.setTargetAtTime(420 + k*760, t0, 0.7);
  }
  function stopDrone(fast){
    wantDrone = false;
    if(!drone) return;
    var d = drone; drone = null;
    if(!live()){ try{ d.a.stop(); d.b.stop(); }catch(e){} return; }
    var t0 = ac.currentTime, dur = fast ? 0.08 : 0.9;
    d.g.gain.cancelScheduledValues(t0);
    d.g.gain.setValueAtTime(Math.max(0.0002, d.g.gain.value), t0);
    d.g.gain.exponentialRampToValueAtTime(0.0002, t0+dur);
    d.f.frequency.cancelScheduledValues(t0);
    d.f.frequency.setValueAtTime(d.f.frequency.value, t0);
    d.f.frequency.exponentialRampToValueAtTime(90, t0+dur);
    try{ d.a.stop(t0+dur+0.05); d.b.stop(t0+dur+0.05); }catch(e){}
  }

  /* 분열 — 마른 나무 두드리는 소리. 갈라질수록 음이 올라갑니다 */
  function split(n){
    if(!live() || !CFG.snd.split) return;
    var t0 = ac.currentTime;
    var f = 470 + Math.min(n, 42)*13;
    burst(t0, 0.07, "bandpass", f*2.2, 7, CFG.snd.split, f*1.5);
    tone(t0, 0.10, "triangle", f, f*0.70, CFG.snd.split*0.45);
  }
  function hit(){
    if(!live() || !CFG.snd.hit) return;
    var t0 = ac.currentTime;
    tone(t0, 0.20, "sine", 155, 52, CFG.snd.hit);
    burst(t0, 0.09, "lowpass", 1100, 0.9, CFG.snd.hit*0.5, 300);
  }
  function death(){
    if(!live()) return;
    stopDrone(false);
    if(CFG.snd.death) tone(ac.currentTime+CFG.deathHold*0.5, 1.0, "sine", 95, 30, CFG.snd.death);
  }
  /* 뇌가 드러나는 동안 — 번지는 소리 + 심장 두 번 */
  function brain(){
    if(!live()) return;
    var t0 = ac.currentTime + CFG.deathHold;
    var end = CFG.lineTo + CFG.brainHold;
    if(CFG.snd.swell){
      var s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
      var f = ac.createBiquadFilter(); f.type="lowpass"; f.Q.value=1.1;
      f.frequency.setValueAtTime(150, t0+CFG.shapeFrom);
      f.frequency.exponentialRampToValueAtTime(1150, t0+CFG.lineTo);
      f.frequency.exponentialRampToValueAtTime(220, t0+end);
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0004, t0+CFG.shapeFrom);
      g.gain.exponentialRampToValueAtTime(CFG.snd.swell, t0+CFG.lineTo);
      g.gain.exponentialRampToValueAtTime(0.0004, t0+end+0.3);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t0+CFG.shapeFrom); s.stop(t0+end+0.4);
    }
    if(CFG.snd.heart){
      var beats = [CFG.lineFrom, CFG.lineTo+0.42];
      for(var i=0;i<beats.length;i++){
        var b = t0 + beats[i];
        tone(b,        0.17, "sine", 68, 41, CFG.snd.heart);
        tone(b + 0.21, 0.21, "sine", 60, 34, CFG.snd.heart*0.68);
      }
    }
  }
  function breath(){
    if(!live() || !CFG.snd.breath) return;
    var t0 = ac.currentTime;
    var s = ac.createBufferSource(); s.buffer = noise;
    var f = ac.createBiquadFilter(); f.type="bandpass"; f.Q.value=0.8;
    f.frequency.setValueAtTime(320, t0);
    f.frequency.exponentialRampToValueAtTime(760, t0+0.55);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0004, t0);
    g.gain.exponentialRampToValueAtTime(CFG.snd.breath, t0+0.42);
    g.gain.exponentialRampToValueAtTime(0.0004, t0+0.95);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0+1.0);
  }

  function apply(){
    if(master && ac) master.gain.setTargetAtTime((on && !ducked) ? CFG.snd.master : 0, ac.currentTime, 0.04);
  }
  function setOn(v){
    on = v;
    try{ window.localStorage.setItem("najasin_mute", v ? "0" : "1"); }catch(e){}
    apply();
    if(v) unlock();
  }
  function duck(v){ ducked = v; apply(); }
  function isOn(){ return on; }

  return {
    unlock:unlock, startDrone:startDrone, stopDrone:stopDrone, tension:tension,
    split:split, hit:hit, death:death, brain:brain, breath:breath,
    setOn:setOn, isOn:isOn, duck:duck
  };
})();

function syncMuteIcon(){
  if(audio.isOn()) muteEl.classList.remove("off");
  else muteEl.classList.add("off");
}
muteEl.addEventListener("click", function(){
  audio.setOn(!audio.isOn());
  syncMuteIcon();
});
syncMuteIcon();

/* ══════════════════════════════════════════════════ 인물 그리기
   판 위에는 분신이 수십 개 깔립니다. 매 프레임 path를 새로 그리면
   후반에 프레임이 떨어져서, 걸음 단계별로 한 번만 그려두고 씁니다. */
function paintFigure(g, sw, pal){
  g.lineJoin="round";
  g.strokeStyle=OUTL;
  g.lineWidth=0.9;

  g.fillStyle=pal.pants;
  g.beginPath();
  g.moveTo(-2.6+sw*0.5,2); g.lineTo(-4.3+sw,11);
  g.lineTo(-1.4+sw,11);    g.lineTo(-0.2,2); g.closePath();
  g.moveTo(0.2,2);         g.lineTo(1.4-sw,11);
  g.lineTo(4.3-sw,11);     g.lineTo(2.6-sw*0.5,2); g.closePath();
  g.fill(); g.stroke();

  g.fillStyle=pal.shirt;
  g.beginPath();
  g.moveTo(-4.4,-6.2); g.lineTo(4.4,-6.2);
  g.lineTo(3.6,3);     g.lineTo(-3.6,3); g.closePath();
  g.fill(); g.stroke();

  g.beginPath();
  g.ellipse(-5.3,-2.4+sw*0.4,1.5,4.4,0.12,0,Math.PI*2);
  g.fill(); g.stroke();
  g.beginPath();
  g.ellipse(5.3,-2.4-sw*0.4,1.5,4.4,-0.12,0,Math.PI*2);
  g.fill(); g.stroke();

  g.fillStyle=pal.skin;
  g.beginPath();
  g.arc(-5.5,2.0+sw*0.5,1.4,0,Math.PI*2);
  g.arc(5.5,2.0-sw*0.5,1.4,0,Math.PI*2);
  g.fill();

  g.beginPath();
  g.arc(0,-10.6,4.1,0,Math.PI*2);
  g.fill(); g.stroke();

  g.fillStyle=pal.hair;
  g.beginPath();
  g.arc(0,-11.0,4.15,Math.PI*0.98,Math.PI*2.02);
  g.lineTo(3.6,-10.2);
  g.lineTo(-3.6,-10.2);
  g.closePath();
  g.fill();
}

var FIG_S = 1.15;
var SPR = {
  frames: 12,
  cw: 16, ch: 30,   // 한 칸 크기(판 좌표 단위)
  ax: 8,  ay: 17,   // 칸 안에서 발밑 기준점
  px: 0, cv: null, ready:false, w:0, h:0
};
function buildSprites(){
  var ps = Math.max(1, FIG_S * view.s * DPR);
  if(SPR.ready && Math.abs(ps - SPR.px) < 0.02) return;
  SPR.px = ps;
  var w = Math.ceil(SPR.cw*ps), h = Math.ceil(SPR.ch*ps);
  SPR.w = w; SPR.h = h;
  var c = document.createElement("canvas");
  c.width = w*SPR.frames; c.height = h;
  var g = c.getContext("2d");
  for(var i=0;i<SPR.frames;i++){
    g.save();
    g.translate(i*w + SPR.ax*ps, SPR.ay*ps);
    g.scale(ps, ps);
    paintFigure(g, Math.sin(i/SPR.frames*Math.PI*2)*1.7, ME_PAL);
    g.restore();
  }
  SPR.cv = c; SPR.ready = true;
}

/* pal을 넘기면 그 자리에서 그립니다. 없으면 캐시를 씁니다. */
function figure(x,y,face,step,alpha,pal){
  if(alpha<=0.004) return;
  if(!pal && SPR.ready){
    var f = Math.floor((step/(Math.PI*2)%1+1)%1*SPR.frames)%SPR.frames;
    var dw = SPR.cw*FIG_S, dh = SPR.ch*FIG_S;
    var dx = -SPR.ax*FIG_S, dy = -SPR.ay*FIG_S;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x,y);
    if(face<0) ctx.scale(-1,1);
    ctx.drawImage(SPR.cv, f*SPR.w, 0, SPR.w, SPR.h, dx, dy, dw, dh);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x,y);
  ctx.scale(face<0?-FIG_S:FIG_S, FIG_S);
  paintFigure(ctx, Math.sin(step)*1.7, pal||ME_PAL);
  ctx.restore();
}

/* ══════════════════════════════════════════════════ 시작 상태 */
function reset(){
  layout();
  buildSprites();
  audio.stopDrone(true);
  phase=PHASE.INTRO; t=0; phaseT=0; shake=0;
  clones=[]; sparks=[]; ghosts=[]; trail=[]; trailTimer=0;
  splitTimer=CFG.splitFirst; score=0;
  player={ x:arena.cx, y:arena.cy,
           hp:CFG.playerHP, inv:0, face:1, step:0, glow:0, kx:0, ky:0 };
  document.body.style.background = "var(--night)";
  cv.style.display="block";
  roomEl.style.display="none";
  introEl.classList.add("on");
  uiEl.classList.remove("on");
  panelEl.classList.remove("on");
  countEl.classList.remove("on");
  actsEl.classList.remove("on");
  room.stop();
}
function startRun(){
  introEl.classList.remove("on");
  phase = PHASE.RUN; phaseT = 0; t = 0;
  splitTimer = CFG.splitFirst;
  audio.unlock();
  audio.startDrone();
}

/* ══════════════════════════════════════════════════ 입력 */
var keys=new Set();
var stick=null;
var STICK_MAX=52, STICK_DEAD=8;

/* 처음 들어왔을 때만 조작 표시를 띄웁니다. 한 번 움직이면 끝 */
var moved=false, hint=1, hintT=0;
var FINE = false;
try{ FINE = window.matchMedia("(hover:hover) and (pointer:fine)").matches; }catch(e){}

/* 한글 입력 상태에서도 WASD가 먹게 e.code를 같이 봅니다 */
var CODE_MAP = {
  KeyW:"up", KeyA:"left", KeyS:"down", KeyD:"right",
  ArrowUp:"up", ArrowLeft:"left", ArrowDown:"down", ArrowRight:"right"
};
function keyName(e){
  if(e.code && CODE_MAP[e.code]) return CODE_MAP[e.code];
  var k = e.key;
  if(k==="ArrowUp"||k==="w"||k==="W") return "up";
  if(k==="ArrowDown"||k==="s"||k==="S") return "down";
  if(k==="ArrowLeft"||k==="a"||k==="A") return "left";
  if(k==="ArrowRight"||k==="d"||k==="D") return "right";
  return null;
}

window.addEventListener("keydown", function(e){
  if(panelEl.classList.contains("on")) return;
  var n = keyName(e);
  if(n){ e.preventDefault(); keys.add(n); audio.unlock(); return; }
  if(e.key===" "||e.key==="Enter"){
    if(phase===PHASE.INTRO){ e.preventDefault(); startRun(); }
    else if(e.key===" ") e.preventDefault();
  }
});
window.addEventListener("keyup", function(e){
  var n = keyName(e);
  if(n) keys["delete"](n);
});
window.addEventListener("blur", function(){ keys.clear(); stick=null; });

cv.addEventListener("pointerdown", function(e){
  cv.setPointerCapture(e.pointerId);
  stick={id:e.pointerId, ox:e.clientX, oy:e.clientY, dx:0, dy:0};
  audio.unlock();
});
cv.addEventListener("pointermove", function(e){
  if(!stick||e.pointerId!==stick.id) return;
  var dx=e.clientX-stick.ox, dy=e.clientY-stick.oy;
  var len=Math.hypot(dx,dy);
  if(len<STICK_DEAD){ stick.dx=0; stick.dy=0; return; }
  if(len>STICK_MAX){
    stick.ox=e.clientX-dx/len*STICK_MAX;
    stick.oy=e.clientY-dy/len*STICK_MAX;
    dx=e.clientX-stick.ox; dy=e.clientY-stick.oy;
    len=Math.hypot(dx,dy);
  }
  stick.dx=dx/STICK_MAX; stick.dy=dy/STICK_MAX;
});
function endStick(e){
  if(stick && e && e.pointerId!==stick.id) return;
  stick=null;
  try{ if(e&&cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId); }catch(_){}
}
cv.addEventListener("pointerup", endStick);
cv.addEventListener("pointercancel", endStick);

function readMove(){
  var mx=0,my=0;
  if(keys.has("left"))  mx-=1;
  if(keys.has("right")) mx+=1;
  if(keys.has("up"))    my-=1;
  if(keys.has("down"))  my+=1;
  var l=Math.hypot(mx,my); if(l>0){ mx/=l; my/=l; }
  if(stick){ mx+=stick.dx; my+=stick.dy; }
  var l2=Math.hypot(mx,my); if(l2>1){ mx/=l2; my/=l2; }
  return {mx:mx,my:my};
}

/* ══════════════════════════════════════════════════ 분신 */
function doSplit(){
  var n=Math.max(2, Math.round(CFG.pathSeconds/TRAIL_DT));
  var path=trail.slice(-n).map(function(p){ return {x:p.x,y:p.y}; });
  var span=0;
  for(var i=1;i<path.length;i++) span+=Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
  if(path.length<2||span<24) path=[{x:player.x,y:player.y}];

  var a=Math.random()*Math.PI*2;
  clones.push({
    x:player.x+Math.cos(a)*3, y:player.y+Math.sin(a)*3,
    vx:Math.cos(a)*80, vy:Math.sin(a)*80,
    birth:0.45, path:path, i:path.length-1, dir:-1, wait:0,
    face:player.face, step:Math.random()*6
  });
  sparks.push({x:player.x,y:player.y,life:0.45,max:0.45,r:24});
  /* 방금 물려준 동선을 잠깐 보여줍니다 —
     좁게 맴돌수록 내가 판 자리에 벽이 생긴다는 걸 알아야 하니까요 */
  if(path.length>1) ghosts.push({ path:path, life:CFG.pathShow, max:CFG.pathShow });
  player.glow=CFG.findGlow;
  shake=Math.min(shake+2, 6.5);
  score++;
  audio.split(score);
}

/* 타원 벽 — 가장자리를 따라 미끄러집니다 */
function clampArena(e,r){
  var ax=Math.max(1, arena.rx-r), ay=Math.max(1, arena.ry-r);
  var nx=(e.x-arena.cx)/ax, ny=(e.y-arena.cy)/ay;
  var d=Math.hypot(nx,ny);
  if(d>1){
    e.x=arena.cx+nx/d*ax;
    e.y=arena.cy+ny/d*ay;
  }
}

/* 갇힌 채로 연달아 맞지 않게 주변을 밀어냅니다 */
function shoveClones(radius, power){
  for(var i=0;i<clones.length;i++){
    var c=clones[i];
    var dx=c.x-player.x, dy=c.y-player.y, d=Math.hypot(dx,dy);
    if(d<0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d=Math.hypot(dx,dy)||1; }
    if(d<radius){
      var k=(1-d/radius)*power;
      c.x+=dx/d*k; c.y+=dy/d*k;
      clampArena(c,9);
    }
  }
}

var CELL=34, grid=new Map();
function rebuildGrid(){
  grid.clear();
  for(var i=0;i<clones.length;i++){
    var c=clones[i];
    var k=(Math.floor(c.x/CELL))+","+(Math.floor(c.y/CELL));
    var b=grid.get(k); if(!b){b=[];grid.set(k,b);}
    b.push(c);
  }
}
function nearby(x,y,span){
  var cx=Math.floor(x/CELL), cy=Math.floor(y/CELL), out2=[];
  for(var gx=cx-span;gx<=cx+span;gx++)
    for(var gy=cy-span;gy<=cy+span;gy++){
      var b=grid.get(gx+","+gy);
      if(b) for(var i=0;i<b.length;i++) out2.push(b[i]);
    }
  return out2;
}

function movePlayer(dt){
  var mv=readMove();
  if(!moved && (mv.mx!==0 || mv.my!==0)) moved=true;
  player.x+=mv.mx*CFG.playerSpeed*dt + player.kx*dt;
  player.y+=mv.my*CFG.playerSpeed*dt + player.ky*dt;
  var decay=Math.exp(-6*dt);
  player.kx*=decay; player.ky*=decay;
  if(mv.mx!==0) player.face=mv.mx>0?1:-1;
  player.step+=Math.hypot(mv.mx,mv.my)*CFG.playerSpeed*dt*0.055;
  clampArena(player,10);
  if(player.glow>0) player.glow-=dt;

  trailTimer-=dt;
  if(trailTimer<=0){
    trailTimer=TRAIL_DT;
    trail.push({x:player.x,y:player.y});
    var cap=Math.round((CFG.pathSeconds+2)/TRAIL_DT);
    if(trail.length>cap) trail.splice(0, trail.length-cap);
  }
}

/* ══════════════════════════════════════════════════ 갱신 */
function update(dt){
  phaseT+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*14);
  var s;
  for(s=sparks.length-1;s>=0;s--){
    sparks[s].life-=dt;
    if(sparks[s].life<=0) sparks.splice(s,1);
  }
  for(s=ghosts.length-1;s>=0;s--){
    ghosts[s].life-=dt;
    if(ghosts[s].life<=0) ghosts.splice(s,1);
  }

  if(phase===PHASE.INTRO){
    movePlayer(dt);
    if(hint>0) hintT+=dt;
    if(moved && hint>0) hint=Math.max(0, hint-dt/CFG.hintFade);
    return;
  }
  if(phase===PHASE.WAKE) return;

  if(phase===PHASE.MORPH){
    if(phaseT>=MORPH_TOTAL){ phase=PHASE.FADE; phaseT=0; }
    return;
  }
  if(phase===PHASE.FADE){
    if(phaseT>=CFG.wakeDelay) enterWake();
    return;
  }

  t+=dt;

  var wasInv = player.inv > 0;
  if(player.inv>0) player.inv-=dt;
  if(wasInv && player.inv<=0) shoveClones(CFG.endShoveR, CFG.endShovePow);

  movePlayer(dt);

  splitTimer-=dt;
  if(splitTimer<=0){
    doSplit();
    splitTimer=Math.max(CFG.splitMin, CFG.splitStart-t*CFG.splitAccel);
  }

  /* 분열 주기가 바닥을 친 뒤에는 걸음으로 조입니다 */
  var late = Math.max(0, t-CFG.lateFrom);
  var cSpeed = Math.min(CFG.cloneSpeedMax, CFG.cloneSpeed + late*CFG.cloneSpeedGain);
  var cPause = Math.max(CFG.clonePauseMin, CFG.clonePause - late*CFG.clonePauseDrop);

  for(var i=0;i<clones.length;i++){
    var c=clones[i];
    if(c.birth>0){
      c.birth-=dt;
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.vx*=0.87; c.vy*=0.87;
      clampArena(c,9);
      continue;
    }
    if(c.path.length<2){ c.step=0; continue; }
    if(c.wait>0){ c.wait-=dt; c.step=0; continue; }

    var tg=c.path[c.i];
    var dx=tg.x-c.x, dy=tg.y-c.y;
    var d=Math.hypot(dx,dy);
    var stepLen=cSpeed*dt;
    if(d<=stepLen+0.5){
      c.x=tg.x; c.y=tg.y;
      c.i+=c.dir;
      if(c.i<0){ c.i=0; c.dir=1; c.wait=cPause; }
      else if(c.i>=c.path.length){ c.i=c.path.length-1; c.dir=-1; c.wait=cPause; }
    } else {
      c.x+=dx/d*stepLen; c.y+=dy/d*stepLen;
      if(Math.abs(dx)>0.4) c.face=dx>0?1:-1;
      c.step+=stepLen*0.055;
    }
    clampArena(c,9);
  }

  audio.tension(clones.length);

  rebuildGrid();
  var R=15;
  for(var j=0;j<clones.length;j++){
    var q=clones[j];
    if(q.birth>0) continue;
    var ax=0,ay=0,n=0;
    var near=nearby(q.x,q.y,1);
    for(var k=0;k<near.length;k++){
      var o=near[k];
      if(o===q) continue;
      var ox=q.x-o.x, oy=q.y-o.y, d2=ox*ox+oy*oy;
      if(d2>0.01&&d2<R*R){
        var dd=Math.sqrt(d2);
        ax+=ox/dd*(1-dd/R); ay+=oy/dd*(1-dd/R);
        if(++n>5) break;
      }
    }
    if(n){ q.x+=ax*30*dt; q.y+=ay*30*dt; clampArena(q,9); }
  }

  if(player.inv<=0){
    var hitList=nearby(player.x,player.y,1);
    for(var h=0;h<hitList.length;h++){
      var e=hitList[h];
      if(e.birth>0) continue;
      var hx=player.x-e.x, hy=player.y-e.y;
      var hd=Math.hypot(hx,hy);
      if(hd<CFG.hitDist){
        player.hp--; player.inv=CFG.invuln; player.glow=CFG.findGlow;
        if(hd<0.01){ hx=Math.random()-0.5; hy=Math.random()-0.5; hd=Math.hypot(hx,hy)||1; }
        if(player.hp<=0){
          phase=PHASE.MORPH; phaseT=0; shake=5;
          audio.death(); audio.brain();
        } else {
          player.kx = hx/hd*CFG.hitKnock;
          player.ky = hy/hd*CFG.hitKnock;
          shoveClones(CFG.hitShoveR, CFG.hitShovePow);
          shake=8;
          audio.hit();
        }
        break;
      }
    }
  }
}

/* ══════════════════════════════════════════════════ 판 모양 — 타원 ↔ 뇌 */
function smooth01(v){
  if(v<=0) return 0;
  if(v>=1) return 1;
  return v*v*(3-2*v);
}
function seg(now, a, b){ return smooth01((now-a)/(b-a)); }

function angDist(a,b){
  var d=(a-b+Math.PI)%(Math.PI*2);
  if(d<0) d+=Math.PI*2;
  return Math.abs(d-Math.PI);
}
/* 각도별 반지름 배율. 1이면 순수한 타원, brainF면 위에서 본 뇌 윤곽.
   각도 0 = 오른쪽, π/2 = 아래(뒤통수), -π/2 = 위(이마) */
function brainF(a){
  var f = 1 + 0.045*Math.sin(a);                                  // 뒤가 조금 넓다
  f -= 0.075*Math.exp(-Math.pow(angDist(a,-Math.PI/2)/0.12, 2));  // 이마 쪽 정중앙 틈
  f -= 0.028*Math.exp(-Math.pow(angDist(a, Math.PI/2)/0.10, 2));  // 뒤통수 쪽은 소뇌가 채우니 얕게
  f += 0.022*Math.exp(-Math.pow(angDist(a, 0)/0.55, 2));          // 옆이 조금 부푼다
  f += 0.022*Math.exp(-Math.pow(angDist(a, Math.PI)/0.55, 2));
  return f;
}
function shapePath(k, zoom){
  var rx=arena.rx*zoom, ry=arena.ry*zoom;
  var N=140;
  ctx.beginPath();
  for(var i=0;i<=N;i++){
    var a=i/N*Math.PI*2;
    var f=1+k*(brainF(a)-1);
    var x=arena.cx+Math.cos(a)*rx*f;
    var y=arena.cy+Math.sin(a)*ry*f;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

/* 정규화 좌표(-1..1)로 그린 주름. x>0 쪽만 정의하고 왼쪽은 뒤집어 씁니다 */
var GYRI = [
  [[0.15,-0.70],[0.26,-0.50],[0.16,-0.30],[0.27,-0.08],[0.17,0.16],[0.27,0.38],[0.17,0.58]],
  [[0.40,-0.62],[0.52,-0.42],[0.41,-0.20],[0.54,0.00],[0.42,0.24],[0.53,0.44],[0.42,0.62]],
  [[0.62,-0.46],[0.73,-0.28],[0.62,-0.06],[0.74,0.14],[0.63,0.34],[0.72,0.52]]
];
var FISSURE = [[0,-0.92],[0.020,-0.58],[-0.020,-0.20],[0.020,0.20],[-0.014,0.58],[0,0.92]];
var CEREB   = [[-0.52,0.66],[-0.26,0.74],[0,0.765],[0.26,0.74],[0.52,0.66]];

function curveThrough(pts, mirror, zoom){
  var rx=arena.rx*zoom, ry=arena.ry*zoom;
  var m = mirror ? -1 : 1;
  function px(p){ return arena.cx + p[0]*m*rx; }
  function py(p){ return arena.cy + p[1]*ry; }
  ctx.beginPath();
  ctx.moveTo(px(pts[0]), py(pts[0]));
  for(var i=1;i<pts.length-1;i++){
    var mx=(px(pts[i])+px(pts[i+1]))/2;
    var my=(py(pts[i])+py(pts[i+1]))/2;
    ctx.quadraticCurveTo(px(pts[i]), py(pts[i]), mx, my);
  }
  var last=pts[pts.length-1];
  ctx.lineTo(px(last), py(last));
  ctx.stroke();
}

function drawBrainLines(alpha, zoom){
  if(alpha<=0) return;
  ctx.save();
  ctx.lineCap="round";

  ctx.globalAlpha=alpha*0.88;
  ctx.strokeStyle=mix(MIXC.ink, MIXC.fiss, alpha);
  ctx.lineWidth=1.5/view.s;
  curveThrough(FISSURE, false, zoom);

  ctx.globalAlpha=alpha*0.62;
  ctx.strokeStyle=mix(MIXC.ink, MIXC.gyrus, alpha);
  ctx.lineWidth=1.15/view.s;
  for(var i=0;i<GYRI.length;i++){
    curveThrough(GYRI[i], false, zoom);
    curveThrough(GYRI[i], true,  zoom);
  }

  ctx.globalAlpha=alpha*0.46;
  ctx.lineWidth=1.1/view.s;
  curveThrough(CEREB, false, zoom);

  ctx.restore();
}

/* ══════════════════════════════════════════════════ 그리기 */
function drawField(){
  var mk=0, figA=1, lineA=0, mt=0;
  if(phase===PHASE.MORPH){
    mt = phaseT - CFG.deathHold;
    mk    = seg(mt, CFG.shapeFrom, CFG.shapeTo);
    figA  = 1 - seg(mt, 0, CFG.figOut);
    lineA = seg(mt, CFG.lineFrom, CFG.lineTo);
  } else if(phase===PHASE.FADE){
    mk=1; figA=0; lineA=1;
  }
  var zoom = 1 + CFG.brainZoom*mk;
  var ck = lineA;   // 색이 물드는 정도 — 주름과 같이 갑니다

  shapePath(mk, zoom);
  if(ck>0.01){
    var gr=ctx.createRadialGradient(
      arena.cx-arena.rx*0.22, arena.cy-arena.ry*0.28, arena.rx*0.12,
      arena.cx, arena.cy, arena.rx*1.28*zoom);
    gr.addColorStop(0, mix(MIXC.floor, MIXC.light, ck));
    gr.addColorStop(1, mix(MIXC.floor, MIXC.deep,  ck));
    ctx.fillStyle=gr;
  } else {
    ctx.fillStyle=COL.floor;
  }
  ctx.fill();

  ctx.strokeStyle = mk>0 ? mix(MIXC.ink, MIXC.edge, ck) : COL.ghost;
  ctx.globalAlpha = mk>0 ? (0.45+0.55*mk) : 0.9;
  ctx.lineWidth = (1.4 + 0.8*mk)/view.s;
  ctx.stroke();
  ctx.globalAlpha = 1;

  drawBrainLines(lineA, zoom);

  if(figA>0){
    /* 방금 물려준 동선 */
    for(var q=0;q<ghosts.length;q++){
      var gh=ghosts[q], gk=gh.life/gh.max;
      ctx.save();
      ctx.globalAlpha=gk*0.38*figA;
      ctx.strokeStyle=COL.ink;
      ctx.lineWidth=1.7/view.s;
      ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath();
      ctx.moveTo(gh.path[0].x, gh.path[0].y);
      for(var gp=1;gp<gh.path.length;gp++) ctx.lineTo(gh.path[gp].x, gh.path[gp].y);
      ctx.stroke();
      ctx.restore();
    }

    if(player.glow>0 && phase!==PHASE.MORPH && phase!==PHASE.FADE){
      var k=player.glow/CFG.findGlow;
      ctx.save();
      ctx.globalAlpha=k*0.6;
      ctx.strokeStyle=COL.ink; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(player.x,player.y,16+(1-k)*26,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    var showMe = player.hp>0 || (phase===PHASE.MORPH && phaseT<CFG.deathHold);

    var all=[];
    for(var i=0;i<clones.length;i++) all.push({e:clones[i],me:false});
    if(showMe) all.push({e:player,me:true});
    all.sort(function(a,b){ return a.e.y-b.e.y; });

    for(var j=0;j<all.length;j++){
      var o=all[j], e=o.e;
      if(o.me){
        var blink=player.inv>0 && player.hp>0 && Math.floor(player.inv*13)%2===0;
        if(!blink) figure(e.x,e.y,e.face,e.step,figA);
      } else {
        var a=e.birth>0 ? 0.35+0.65*(1-e.birth/0.45) : 1;
        figure(e.x,e.y,e.face,e.step,a*figA);
      }
    }

    for(var s=0;s<sparks.length;s++){
      var sp=sparks[s], kk=1-sp.life/sp.max;
      ctx.save();
      ctx.globalAlpha=(1-kk)*0.45*figA;
      ctx.strokeStyle=COL.ink; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(sp.x,sp.y,5+kk*sp.r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  if(phase===PHASE.INTRO && hint<=0){
    var p=0.5+0.5*Math.sin(phaseT*2.2);
    ctx.save();
    ctx.globalAlpha=0.2+0.28*p;
    ctx.strokeStyle=COL.ghost; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(player.x,player.y,26+p*7,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  if(figA>0 && phase!==PHASE.INTRO){
    ctx.save();
    ctx.globalAlpha=figA;
    var total=CFG.playerHP, gap=15;
    var startX=arena.cx-(total-1)*gap/2;
    for(var h=0;h<total;h++){
      ctx.beginPath();
      ctx.arc(startX+h*gap, arena.y-11, 4, 0, Math.PI*2);
      if(h<player.hp){ ctx.fillStyle=COL.lit; ctx.fill(); }
      else{ ctx.strokeStyle=COL.litLine; ctx.lineWidth=1.5; ctx.stroke(); }
    }
    ctx.restore();
  }
}

/* 처음 들어왔을 때만 나오는 조작 표시.
   터치면 손가락을 밀라는 뜻의 고리, 키보드면 방향키. 한 번 움직이면 사라집니다.
   밝은 타원 위에도 어두운 바깥에도 걸치니까, 밝은 테두리를 깔고 그 위에
   어두운 선을 얹어서 어느 쪽에서든 보이게 합니다. */
function keyCap(x, y, sz, dir, on, under){
  var h = sz/2 + (under?2:0), r = 4;
  ctx.beginPath();
  ctx.moveTo(x-h+r, y-h);
  ctx.lineTo(x+h-r, y-h); ctx.quadraticCurveTo(x+h, y-h, x+h, y-h+r);
  ctx.lineTo(x+h, y+h-r); ctx.quadraticCurveTo(x+h, y+h, x+h-r, y+h);
  ctx.lineTo(x-h+r, y+h); ctx.quadraticCurveTo(x-h, y+h, x-h+r, y+h);
  ctx.lineTo(x-h, y-h+r); ctx.quadraticCurveTo(x-h, y-h, x-h+r, y-h);
  ctx.closePath();
  if(under){
    ctx.strokeStyle = COL.lit; ctx.lineWidth = 4.4; ctx.stroke();
    if(on){ ctx.fillStyle = COL.lit; ctx.fill(); }
    return;
  }
  if(on){ ctx.fillStyle = COL.ink; ctx.fill(); }
  else { ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.8; ctx.stroke(); }

  var a = 4.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(dir*Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(0, -a);
  ctx.lineTo(a*0.86, a*0.62);
  ctx.lineTo(-a*0.86, a*0.62);
  ctx.closePath();
  ctx.fillStyle = on ? COL.paper : COL.ink;
  ctx.fill();
  ctx.restore();
}

function drawHint(){
  var px = view.ox + player.x*view.s;
  var py = view.oy + player.y*view.s;
  var pulse = 0.72 + 0.28*Math.sin(hintT*2.4);
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(FINE){
    var sz = 26, gap = 30, by = py + 54;
    var cur = Math.floor(hintT*1.5)%4;      // 위 오른쪽 아래 왼쪽
    var pos = [[px, by-gap, 0],[px+gap, by, 1],[px, by, 2],[px-gap, by, 3]];
    var pass, i;
    for(pass=0; pass<2; pass++){
      ctx.globalAlpha = hint * (pass===0 ? 0.34 : 0.85*pulse);
      for(i=0;i<4;i++) keyCap(pos[i][0], pos[i][1], sz, pos[i][2], cur===i, pass===0);
    }
  } else {
    var ang = hintT*1.5;
    var reach = 0.55 + 0.45*Math.sin(hintT*3.0);   // 밀었다 놓았다
    var tx = px + Math.cos(ang)*STICK_MAX*reach;
    var ty = py + Math.sin(ang)*STICK_MAX*reach;

    ctx.globalAlpha = hint*0.32;
    ctx.strokeStyle = COL.lit; ctx.lineWidth = 4.4;
    ctx.beginPath(); ctx.arc(px, py, STICK_MAX, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = COL.lit;
    ctx.beginPath(); ctx.arc(tx, ty, 15.5, 0, Math.PI*2); ctx.fill();

    ctx.globalAlpha = hint*0.62;
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(px, py, STICK_MAX, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = hint*0.34;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = hint*0.88*pulse;
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.arc(tx, ty, 13, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawStick(){
  if(!stick) return;
  var tx = stick.ox + stick.dx*STICK_MAX, ty = stick.oy + stick.dy*STICK_MAX;
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 밝은 밑선 — 조이스틱이 어두운 바깥에 찍혀도 보이게 */
  ctx.globalAlpha = 0.30;
  ctx.strokeStyle = COL.lit; ctx.lineWidth = 4.2;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = COL.lit;
  ctx.beginPath(); ctx.arc(tx, ty, 17.5, 0, Math.PI*2); ctx.fill();

  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.7;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 0.30;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 7, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = COL.ink;
  ctx.beginPath(); ctx.arc(tx, ty, 15, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* 타원 바깥은 어둠입니다. 평평하게 칠하면 화면이 죽어서,
     타원 쪽이 조금 밝고 화면 끝으로 갈수록 깊어지게 둡니다. */
  var scx = view.ox + arena.cx*view.s;
  var scy = view.oy + arena.cy*view.s;
  var far = Math.hypot(Math.max(scx, W-scx), Math.max(scy, H-scy));
  var bg = ctx.createRadialGradient(scx, scy, arena.rx*view.s*0.9, scx, scy, far);
  bg.addColorStop(0, COL.night2);
  bg.addColorStop(1, COL.night);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);
  if(shake>0 && !REDUCE) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  ctx.restore();

  if(phase===PHASE.INTRO && hint>0) drawHint();
  if(phase!==PHASE.MORPH && phase!==PHASE.FADE) drawStick();

  if(phase===PHASE.FADE){
    ctx.save();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalAlpha=Math.min(1, phaseT/CFG.wakeDelay);
    ctx.fillStyle=COL.paper; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* ══════════════════════════════════════════════════ 3D — 누워서 눈 뜨기 */
var room = (function(){
  var ready=false, running=false;
  var scene, camera, renderer, head, calmEyes=[], lids=[], mouth, brows=[];
  var clock=0, blinkWait=3.4, blinking=0;
  var openness=0;

  function has3D(){
    try{
      var c=document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl')));
    }catch(e){ return false; }
  }

  function build(){
    if(!window.THREE || !has3D()) return false;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xECEEF1);

    camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    roomEl.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xf6f8f4, 0x9aa49e, 0.70));
    var key = new THREE.DirectionalLight(0xfff4e6, 0.62);
    key.position.set(1.8, 3.4, 3.6); scene.add(key);
    var fill = new THREE.DirectionalLight(0xd9e4f2, 0.30);
    fill.position.set(-3.2, 0.4, 1.6); scene.add(fill);
    var rim = new THREE.DirectionalLight(0xb9cde8, 0.34);
    rim.position.set(-1.0, 1.6, -4.0); scene.add(rim);

    var SKINM  = new THREE.MeshStandardMaterial({ color:0xEDBC97, roughness:0.86 });
    var INKM   = new THREE.MeshStandardMaterial({ color:0x1B2430, roughness:0.45 });
    var HAIRM  = new THREE.MeshStandardMaterial({ color:0x1B2430, roughness:0.62 });
    var PILLOW = new THREE.MeshStandardMaterial({ color:0xE9ECEF, roughness:0.95 });
    var QUILT  = new THREE.MeshStandardMaterial({ color:0x41506A, roughness:0.9 });
    var SHEET  = new THREE.MeshStandardMaterial({ color:0xDDE2E7, roughness:0.95 });

    /* 침대 */
    var bed = new THREE.Group();
    scene.add(bed);

    var mattress = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.7, 4.4), SHEET);
    mattress.position.set(0, -1.62, -0.2);
    bed.add(mattress);

    var pillow = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.62, 2.5), PILLOW);
    pillow.position.set(-0.15, -1.20, -0.1);
    pillow.rotation.z = 0.04;
    bed.add(pillow);

    var quilt = new THREE.Mesh(new THREE.BoxGeometry(6.9, 0.85, 3.0), QUILT);
    quilt.position.set(2.9, -1.15, -0.15);
    bed.add(quilt);

    var fold = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 3.0, 20, 1, false, 0, Math.PI), SHEET);
    fold.rotation.z = Math.PI/2;
    fold.rotation.y = Math.PI/2;
    fold.position.set(0.62, -0.76, -0.15);
    bed.add(fold);

    /* 머리 — 오락실 얼굴 */
    head = new THREE.Group();
    head.position.set(-0.35, -0.42, 0.35);
    head.rotation.z = -1.34;      // 옆으로 누움
    head.rotation.y = 0.34;
    head.rotation.x = 0.06;
    scene.add(head);

    var skull = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 40), SKINM);
    skull.scale.set(1, 1.07, 0.97);
    head.add(skull);

    var jaw = new THREE.Mesh(new THREE.SphereGeometry(0.66, 34, 28), SKINM);
    jaw.position.set(0, -0.56, 0.10);
    jaw.scale.set(0.98, 0.86, 0.95);
    head.add(jaw);

    function strand(offset, dir, phiEnd){
      var pts=[], steps=14;
      for(var i=0;i<=steps;i++){
        var phi = 0.16 + (phiEnd-0.16)*(i/steps);
        var o = offset*(1+Math.sin(phi)*0.22);
        var a = dir>0 ? o : (Math.PI-o);
        var r = 1.045;
        pts.push(new THREE.Vector3(
          Math.sin(phi)*Math.sin(a)*r,
          Math.cos(phi)*r*1.07,
          Math.sin(phi)*Math.cos(a)*r*0.97
        ));
      }
      head.add(new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 22, 0.055, 7, false),
        HAIRM
      ));
    }
    [-0.78,-0.27,0.27,0.78].forEach(function(o){
      strand(o, 1, 1.06);
      strand(o,-1, 1.74);
    });

    var crown = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), HAIRM);
    crown.position.set(0, 1.055, -0.02);
    crown.scale.set(1.0, 0.42, 1.0);
    head.add(crown);

    [-1,1].forEach(function(s){
      var ear = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16), SKINM);
      ear.position.set(0.97*s, -0.06, 0);
      ear.scale.set(0.38, 1.05, 0.72);
      head.add(ear);
    });

    var nose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), SKINM);
    nose.position.set(0, -0.11, 0.93);
    nose.scale.set(0.78, 0.92, 1.15);
    head.add(nose);

    [-1,1].forEach(function(s){
      var eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 16), INKM);
      eye.position.set(0.365*s, 0.10, 0.855);
      eye.scale.set(0.95, 0.001, 0.55);
      head.add(eye);
      calmEyes.push(eye);

      var lid = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.036, 9, 22, Math.PI), INKM);
      lid.position.set(0.365*s, 0.09, 0.855);
      lid.rotation.z = Math.PI;
      lid.rotation.x = -0.14;
      head.add(lid);
      lids.push(lid);

      var brow = new THREE.Mesh(new THREE.BoxGeometry(0.29, 0.052, 0.07), INKM);
      brow.position.set(0.375*s, 0.395, 0.86);
      brow.rotation.z = -0.08*s;
      brow.rotation.x = -0.18;
      head.add(brow);
      brows.push(brow);
    });

    mouth = new THREE.Mesh(new THREE.SphereGeometry(0.10, 18, 14), INKM);
    mouth.position.set(0, -0.38, 0.87);
    mouth.scale.set(1.15, 0.9, 0.35);
    head.add(mouth);

    var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.52, 0.9, 22), SKINM);
    neck.position.set(0, -1.32, -0.02);
    head.add(neck);

    ready = true;
    resizeR();
    return true;
  }

  function resizeR(){
    if(!ready) return;
    var w = roomEl.clientWidth || window.innerWidth;
    var h = roomEl.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    // 세로로 긴 화면일수록 뒤로 물러난다
    var dist = 8.4 * Math.max(1, (h/w) * 0.62);
    camera.position.set(0.15, 0.9, Math.min(14, Math.max(7.2, dist)));
    camera.lookAt(-0.2, -0.55, 0);
    camera.updateProjectionMatrix();
  }

  function start(){
    if(!ready && !build()) return false;
    running = true;
    clock = 0; openness = 0; blinkWait = 3.4; blinking = 0;
    roomEl.style.display = "block";
    resizeR();
    return true;
  }
  function stop(){ running=false; }

  function tick(dt, elapsed){
    if(!running||!ready) return;
    clock += dt;

    var op = 0;
    if(elapsed > CFG.eyeShut){
      op = Math.min(1, (elapsed-CFG.eyeShut)/CFG.eyeOpen);
      op = op*op*(3-2*op);
    }
    openness = op;

    var blinkK = 1;
    if(op >= 1){
      blinkWait -= dt;
      if(blinkWait<=0 && blinking<=0){ blinking=0.14; blinkWait=2.8+Math.random()*4.0; }
      if(blinking>0) blinking -= dt;
      if(blinking>0) blinkK = 1 - Math.sin(Math.PI*(blinking/0.14))*0.92;
    }

    for(var i=0;i<calmEyes.length;i++){
      calmEyes[i].scale.set(0.95, Math.max(0.001, 1.18*openness*blinkK), 0.55);
      lids[i].visible = openness < 0.30;
    }
    for(var b=0;b<brows.length;b++){
      brows[b].position.y = 0.395 + openness*0.045;
    }
    mouth.scale.set(1.15, 0.9 - openness*0.18, 0.35);

    var breathe = Math.sin(clock*0.85)*0.022;
    head.position.y = -0.42 + breathe;
    head.rotation.z = -1.34 + Math.sin(clock*0.85)*0.010 + openness*0.045;

    renderer.render(scene, camera);
  }

  return {
    get ready(){ return ready; },
    start:start, stop:stop, tick:tick, resize:resizeR
  };
})();

/* ══════════════════════════════════════════════════ 마무리 화면 */
var wakeT = 0, countShown = false, actsShown = false, breathDone = false;
var runSeconds = 0;

function enterWake(){
  phase = PHASE.WAKE;
  phaseT = 0; wakeT = 0;
  runSeconds = t;
  countShown = false; actsShown = false; breathDone = false;
  countEl.textContent = String(score);
  cv.style.display = "none";
  document.body.style.background = "var(--paper)";
  uiEl.classList.add("on");
  fetchBoard(null);   // 버튼 누르기 전에 미리 받아둡니다
  if(!room.start()){
    roomEl.style.display = "none";
  }
}

function wakeTick(dt){
  wakeT += dt;
  room.tick(dt, wakeT);

  if(!breathDone && wakeT >= Math.max(0, CFG.eyeShut-0.4)){
    breathDone = true; audio.breath();
  }
  var countAt = CFG.eyeShut + CFG.eyeOpen + CFG.countDelay;
  if(!countShown && wakeT >= countAt){ countShown = true; countEl.classList.add("on"); }
  if(!actsShown && wakeT >= countAt + CFG.actsDelay){ actsShown = true; actsEl.classList.add("on"); }
}

/* ══════════════════════════════════════════════════ 랭킹 */
var MY_ID = (function(){
  var k = "najasin_id", v = "";
  try{
    v = window.localStorage.getItem(k) || "";
    if(!v){
      v = Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
      v = v.replace(/[^A-Za-z0-9]/g,"").slice(0,16);
      window.localStorage.setItem(k, v);
    }
  }catch(e){
    v = Math.random().toString(36).slice(2,10);
  }
  return v;
})();

function savedName(){
  try{ return window.localStorage.getItem("najasin_name") || ""; }catch(e){ return ""; }
}
function rememberName(n){
  try{ window.localStorage.setItem("najasin_name", n); }catch(e){}
}

var jsonpSeq = 0;
function jsonp(url, done){
  var name = "najasinCb" + (++jsonpSeq);
  var s = document.createElement("script");
  var timer = setTimeout(function(){ cleanup(); done(null); }, 9000);
  function cleanup(){
    clearTimeout(timer);
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function(data){ cleanup(); done(data); };
  s.onerror = function(){ cleanup(); done(null); };
  s.src = url + (url.indexOf("?")>=0 ? "&" : "?") + "callback=" + name;
  document.head.appendChild(s);
}

var boardRows = null, boardFailed = false;

function fetchBoard(cb){
  if(!RANK_URL){ if(cb) cb(false); return; }
  jsonp(RANK_URL + "?game=najasin", function(rows){
    if(rows && rows.length !== undefined){ boardRows = rows; boardFailed = false; }
    else boardFailed = true;
    if(cb) cb(!boardFailed);
  });
}
function renderBoard(highlightName){
  if(!boardRows || !boardRows.length){
    boardEl.innerHTML = "";
    noteEl.textContent = boardFailed ? "지금은 순위를 불러오지 못했습니다" : "";
    return;
  }
  noteEl.textContent = "";
  var html = "";
  for(var i=0;i<boardRows.length && i<50;i++){
    var r = boardRows[i];
    var me = highlightName && r.n === highlightName;
    html += '<div class="row' + (me?" me":"") + '">' +
              '<span class="no">' + (i+1) + '</span>' +
              '<span class="nm"></span>' +
              '<span class="va">' + (Number(r.d)||0) + '</span>' +
            '</div>';
  }
  boardEl.innerHTML = html;
  var names = boardEl.querySelectorAll(".nm");
  for(var j=0;j<names.length;j++) names[j].textContent = String(boardRows[j].n);
}
function openBoard(highlightName){
  if(boardRows) renderBoard(highlightName);
  else noteEl.textContent = "불러오는 중";
  fetchBoard(function(){ renderBoard(highlightName); });
}

/* 분열 주기 공식상 이 점수가 나오려면 최소 몇 초가 필요한지.
   서버(GAS)에서도 같은 계산으로 한 번 더 막아주는 게 좋습니다. */
function minSecondsFor(n){
  var sec = CFG.splitFirst, k = 0;
  for(var i=1;i<n;i++){
    k = Math.max(CFG.splitMin, CFG.splitStart - sec*CFG.splitAccel);
    sec += k;
  }
  return sec;
}

function submitScore(name, done){
  if(!RANK_URL){ done(false); return; }
  if(score > 0 && runSeconds + 1.5 < minSecondsFor(score)){ done(false); return; }
  var body = JSON.stringify({
    game:"najasin", id:MY_ID, name:name,
    count:score, sec:Math.round(runSeconds*10)/10
  });
  fetch(RANK_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: body
  }).then(function(res){ return res.json(); })
    .then(function(j){ done(!!(j && j.ok)); })
    .catch(function(){ done(false); });
}

/* ══════════════════════════════════════════════════ 버튼 */
var btnStart = document.getElementById("btnStart");
var btnRankIntro = document.getElementById("btnRankIntro");
var btnRank = document.getElementById("btnRank");
var btnAgain = document.getElementById("btnAgain");
var btnSend = document.getElementById("btnSend");
var btnBack = document.getElementById("btnBack");
var btnClose = document.getElementById("btnClose");

if(!RANK_URL){
  btnRank.style.display = "none";
  btnRankIntro.style.display = "none";
}

btnStart.addEventListener("click", function(){
  audio.unlock();
  startRun();
});

btnRankIntro.addEventListener("click", function(){
  audio.unlock();
  panelEl.classList.add("viewonly");
  panelEl.classList.add("on");
  noteEl.textContent = "";
  openBoard(savedName() || null);
});
btnClose.addEventListener("click", function(){
  panelEl.classList.remove("on");
  panelEl.classList.remove("viewonly");
});

btnRank.addEventListener("click", function(){
  panelEl.classList.remove("viewonly");
  panelEl.classList.add("on");
  nameIn.value = savedName();
  noteEl.textContent = "";
  openBoard(null);
  if(!nameIn.value) setTimeout(function(){ nameIn.focus(); }, 60);
});

function restart(){
  keys.clear();
  stick = null;
  panelEl.classList.remove("on");
  panelEl.classList.remove("viewonly");
  reset();
  startRun();
}
btnAgain.addEventListener("click", restart);
btnBack.addEventListener("click", restart);

btnSend.addEventListener("click", function(){
  var n = (nameIn.value||"").trim().slice(0,8);
  if(!n){ nameIn.focus(); return; }
  rememberName(n);
  btnSend.disabled = true;
  noteEl.textContent = "보내는 중";
  submitScore(n, function(ok){
    btnSend.disabled = false;
    if(ok){
      noteEl.textContent = "";
      setTimeout(function(){ boardRows = null; openBoard(n); }, 400);
    } else {
      noteEl.textContent = "등록하지 못했습니다";
    }
  });
});
nameIn.addEventListener("keydown", function(e){
  if(e.key === "Enter") btnSend.click();
});

/* ══════════════════════════════════════════════════ 루프 */
var paused = false;
document.addEventListener("visibilitychange", function(){
  paused = document.hidden;
  audio.duck(paused);
  if(!paused) last = 0;
});

var last = 0;
function loop(now){
  if(paused){ last = 0; requestAnimationFrame(loop); return; }
  if(!last) last = now;
  var dt = (now-last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;

  if(phase === PHASE.WAKE){
    update(dt);
    wakeTick(dt);
  } else {
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);
</script>
